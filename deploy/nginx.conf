# ==============================================================================
# Profarm Shiraz - Production Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/profarm-shiraz.ir and symlink to sites-enabled
# ==============================================================================

# Rate Limiting Zone to mitigate Layer-7 DDoS and brute force attacks
limit_req_zone $binary_remote_addr zone=profarm_limit:10m rate=20r/s;

# 1. HTTP to HTTPS Automatic Redirect
server {
    listen 80;
    listen [::]:80;
    server_name profarm-shiraz.ir www.profarm-shiraz.ir;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name profarm-shiraz.ir www.profarm-shiraz.ir;

    # SSL Certificates (managed via Certbot: certbot --nginx -d profarm-shiraz.ir)
    ssl_certificate /etc/letsencrypt/live/profarm-shiraz.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profarm-shiraz.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip Compression for Iranian Internet optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Maximum request body. CMS images are sent as data URLs (5 MB file cap, about 6.7 MB base64), so 8M is
    # the smallest limit that still allows them. All other API bodies are small JSON.
    client_max_body_size 8M;

    # Static Assets & Next.js Bundles Caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    # Main Application Proxy
    location / {
        limit_req zone=profarm_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Client IP forwarding. The app reads X-Real-IP only when TRUST_PROXY_HEADERS=1 (.env).
        # X-Real-IP is set from the socket address, so clients cannot forge it through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Strip CDN and forwarded headers that clients could send. Only the proxy-set headers above are trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Ar-Real-Ip "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for banking callbacks and slow mobile networks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
